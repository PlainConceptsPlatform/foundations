name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default. No job here needs to write to the repo.
permissions:
  contents: read

# A new push to the same ref makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # package.json declares engines.node ">=20". Test the range we claim
        # rather than only the version we happen to deploy on.
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The build was never gated, so a broken build could reach main and was
      # only caught by the deploy. It also exercises sync-docs and gen-tokens.
      - name: Build
        run: pnpm build

      # Generated content is committed so it is reviewable in a diff. If a
      # generator's input changed without the output being regenerated, or
      # someone hand-edited a generated page, the tree is now dirty.
      - name: Generated content is up to date
        run: |
          pnpm --filter @plainconceptsplatform/docs gen
          git diff --exit-code -- apps/docs/content/docs/components apps/docs/lib/tokens.generated.ts \
            || { echo "::error::Generated files are stale. Run 'pnpm --filter @plainconceptsplatform/docs gen' and commit the result."; exit 1; }

  # Hands a bot pull request to the merge gate as soon as CI settles. GitHub does not deliver
  # workflow_run for CI runs a bot started, so without this the router never hears that CI
  # finished and the gate only sees the pull request on the housekeeping belt, hours later.
  # ubuntu-latest on purpose: this job sleeps and makes one API call, so it must not occupy a
  # slot on the agent fleet the workers themselves queue for.
  dispatch-merge-gate:
    name: Dispatch merge gate
    needs: [check]
    if: >
      always() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft == false &&
      (github.event.pull_request.user.login == 'app/github-actions' || endsWith(github.event.pull_request.user.login, '[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      # GITHUB_TOKEN on purpose: workflow_dispatch is one of the two events it may raise, so no
      # App token is needed.
      - name: Dispatch merge gate after CI settles
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS: ${{ needs.check.result }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          REF: ${{ github.event.repository.default_branch }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          sleep 60
          conclusion=success
          for result in $RESULTS; do
            case "$result" in
              failure|timed_out) conclusion=failure; break ;;
              # A superseded run (a newer push cancelled it): the newer run dispatches instead.
              # The router's ci-conclusion input has no "cancelled" choice.
              cancelled) echo "CI was cancelled; the newer run dispatches the gate."; exit 0 ;;
            esac
          done
          gh workflow run work-router.yml --repo "$REPO" --ref "$REF" \
            -f operation=merge-gate \
            -f pr-number="$PR_NUMBER" \
            -f ci-conclusion="$conclusion" \
            -f ci-run-id="$RUN_ID"
